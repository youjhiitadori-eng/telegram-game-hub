<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 Snake</title>
<style>
    body { background: #111; color: #0f0; font-family: monospace; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; touch-action: none; }
    canvas { background: #000; border: 2px solid #0f0; max-width: 100%; }
    #score { font-size: 24px; margin-bottom: 10px; font-weight: bold; }
    .dpad { display: grid; grid-template-columns: repeat(3, 60px); gap: 10px; margin-top: 20px; }
    .dpad button { background: #333; color: #fff; border: 2px solid #555; border-radius: 10px; height: 60px; font-size: 24px; }
    .dpad button:active { background: #0f0; color: #000; }
    .empty { visibility: hidden; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game" width="300" height="300"></canvas>
<div class="dpad">
    <div class="empty"></div><button onclick="dir('up')">⬆️</button><div class="empty"></div>
    <button onclick="dir('left')">⬅️</button><div class="empty"></div><button onclick="dir('right')">➡️</button>
    <div class="empty"></div><button onclick="dir('down')">⬇️</button><div class="empty"></div>
</div>
<script>
    const canvas = document.getElementById('game'); const ctx = canvas.getContext('2d'); const box = 15;
    let snake = [{x: 10, y: 10}]; let food = {x: 5, y: 5}; let d = 'right'; let score = 0; let gameOver = false;
    function dir(newDir) { if (newDir === 'up' && d !== 'down') d = 'up'; if (newDir === 'down' && d !== 'up') d = 'down'; if (newDir === 'left' && d !== 'right') d = 'left'; if (newDir === 'right' && d !== 'left') d = 'right'; }
    document.addEventListener('keydown', (e) => { if(e.key === 'ArrowUp') dir('up'); if(e.key === 'ArrowDown') dir('down'); if(e.key === 'ArrowLeft') dir('left'); if(e.key === 'ArrowRight') dir('right'); });
    function draw() {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < snake.length; i++) { ctx.fillStyle = i === 0 ? '#0f0' : '#080'; ctx.fillRect(snake[i].x * box, snake[i].y * box, box - 2, box - 2); }
        ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(food.x * box + box/2, food.y * box + box/2, box/2 - 2, 0, Math.PI * 2); ctx.fill();
    }
    function update() {
        if (gameOver) return; let headX = snake[0].x; let headY = snake[0].y;
        if (d === 'up') headY--; if (d === 'down') headY++; if (d === 'left') headX--; if (d === 'right') headX++;
        if (headX < 0 || headX >= 20 || headY < 0 || headY >= 20) { gameOver = true; alert('Game Over! Score: ' + score); location.reload(); return; }
        for (let i = 0; i < snake.length; i++) { if (snake[i].x === headX && snake[i].y === headY) { gameOver = true; alert('Game Over! Score: ' + score); location.reload(); return; } }
        snake.unshift({x: headX, y: headY});
        if (headX === food.x && headY === food.y) { score += 10; document.getElementById('score').innerText = 'Score: ' + score; food = { x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20) }; } else { snake.pop(); }
        draw();
    }
    setInterval(update, 150);
</script>
</body>
</html>
